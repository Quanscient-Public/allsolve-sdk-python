physicsSets:
- name: Physics 1
  physics:
  - type: solidMechanics
    interactions:
    - type: clamp
      name: Clamp
      enabled: true
      target: clamp
meshes:
- name: Mesh 1
  useMeshRefiner: false
  scaleFactor: '0.25'
  curvatureEnhancement: '12.0'
  targetWidthToHeightRatio: '4.0'
  maxRunTimeMinutes: 60
  simpleExtrusion:
    subLayerCounts:
    - '5'
    - '10'
    - '5'
    - '10'
    - '5'
    regions:
    - all
simulations:
- name: Simulation 1
  description: ''
  maxRunTimeMinutes: 60
  solverMode: iterative
  analysisType: eigenmode
  mesh: Mesh 1
  physicsSet: Physics 1
  numRequestedEigenmodes: '5'
  targetEigenfrequency: '0'
  eigenmodePortAnalysis: false
  solverTolerance: 1e-6
  numericalJacobian: false
  disabledScriptSections: []
  outputs:
  - type: fieldOutput
    name: u
    enabled: true
    filter:
      type: None
    skinOnly: true
    expression: u
