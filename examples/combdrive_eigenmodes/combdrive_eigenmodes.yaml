name: Combdrive Eigenmodes demo
description: Eigenmode analysis of a MEMS comb-drive accelerometer to find the first
  5 or more eigenmodes.
dimension: 3
geometries:
- name: Comb_drive_Accelerometer.gds
  type: gds2
  filepath: Comb_drive_Accelerometer.gds
  cleanup: false
  unit: micrometer
  layers:
  - layer: 23
    type: 0
    absoluteZ0: '61.25'
    thickness: '0.1'
    name: Reflector
  - layer: 2
    type: 0
    absoluteZ0: '31.25'
    thickness: '30.0'
    name: Comb top
  - layer: 1
    type: 0
    absoluteZ0: '1.0'
    thickness: '30.0'
    name: Comb bottom
  - layer: 12
    type: 0
    absoluteZ0: '31.0'
    thickness: '0.25'
    name: Oxide separator
  - layer: 11
    type: 0
    absoluteZ0: '0.0'
    thickness: '1.0'
    name: Anchor
  extrudeParameters:
    unifyLayerDiscretizations: 'off'
    fuzzyValue: 0.0001
    featureAngleThreshold: 30.0
    lengthRatioThreshold: 5.0
    circleMaxArcAnglePerSegment: 5.625
    circleFitToleranceFraction: 200.0
    splineMethod: iterative
    splineTolerance: 0.1
    iterativeMaxIterations: '5'
regions:
- name: gold
  entityType: volume
  type: regionRule
  attributePath:
  - key: name
    value: Reflector
- name: anchor
  entityType: volume
  type: regionRule
  attributePath:
  - key: name
    value: Anchor
- name: separators
  entityType: volume
  type: regionRule
  attributePath:
  - key: name
    value: Oxide separator
- name: comb top
  entityType: volume
  type: regionRule
  attributePath:
  - key: name
    value: Comb top
- name: comb bottom
  entityType: volume
  type: regionRule
  attributePath:
  - key: name
    value: Comb bottom
- name: clamp
  entityType: volume
  type: computed
  operation: union
  regions:
  - anchor
- name: silicon_dioxide
  entityType: volume
  type: computed
  operation: union
  regions:
  - anchor
  - separators
- name: monocrystalline_silicon
  entityType: volume
  type: computed
  operation: union
  regions:
  - comb top
  - comb bottom
- name: all
  entityType: volume
  type: computed
  operation: union
  regions:
  - silicon_dioxide
  - gold
  - monocrystalline_silicon
