materials:
- name: Silicon dioxide
  description: Amorphous SiO2
  color: '#F1FCFF'
  abbreviation: SiO₂
  target: Silicon dioxide target
  density: '2200'
  heatCapacity: '733'
  coefficientOfThermalExpansion: '7.64e-6'
  electricPermittivity: 3.9*epsilon0
  magneticPermeability: mu0
  thermalConductivity: '9.50'
  elasticityMatrix:
    youngsModulus: 70e9
    poissonsRatio: '0.17'
- name: Polycrystalline Silicon
  description: 'Appendix G: Semiconducting Materials, Table G.1'
  color: '#87CEEB'
  abbreviation: Poly-Si
  target: Polycrystalline Silicon target
  density: '2320'
  heatCapacity: '678'
  coefficientOfThermalExpansion: '2.5e-6'
  electricConductivity: 7.69e4
  electricPermittivity: 4.2*epsilon0
  magneticPermeability: (1 - 39e-7)*mu0
  thermalConductivity: '34'
  elasticityMatrix:
    youngsModulus: 161e9
    poissonsRatio: '0.22'
- name: Molybdenum
  description: A new material without any existing properties
  color: '#535050'
  target: Molybdenum target
  density: '10223'
  elasticityMatrix:
    youngsModulus: 329e9
    poissonsRatio: '0.31'
