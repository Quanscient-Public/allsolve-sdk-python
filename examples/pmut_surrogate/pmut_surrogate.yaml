name: PMUT Pareto demo
description: 'Circular single cell PMUT | infinite symmetry | water load '
dimension: 3
pmlSettings:
  numLayers: 2
variables:
- name: piezo_thick
  expression: 1e-6
- name: elastic_thick
  expression: 2e-6
- name: oxide_thk
  expression: 2e-6
- name: freq
  expression: 13e6
- name: bot_elec_thick
  expression: 150e-9
- name: pitch
  expression: 60e-6
- name: mesh_size
  expression: 6e-6
- name: qdamp
  expression: '100'
- name: nfreqs
  expression: '51'
- name: top_elec_thk
  expression: 200e-9
- name: ppc
  expression: '25'
- name: ncycles
  expression: '10'
- name: npad
  expression: '40'
- name: fmax
  expression: 26e6
- name: cavity_frac
  expression: '0.83'
- name: bot_elec_frac
  expression: '0.5'
- name: stack_thick
  expression: oxide_thk+piezo_thick+elastic_thick
- name: load_thick
  expression: 1480/freq
- name: cavity_rad
  expression: pitch*cavity_frac/2
- name: bot_elec_rad
  expression: cavity_rad*bot_elec_frac
geometries:
- name: SiO2
  type: box
  position:
    x: 0.0
    y: 0.0
    z: oxide_thk/2
  size:
    x: pitch
    y: pitch
    z: oxide_thk
  rotation:
    x: 0.0
    y: 0.0
    z: 0.0
  alignment: center
- name: AlN
  type: box
  position:
    x: 0.0
    y: 0.0
    z: oxide_thk+piezo_thick/2
  size:
    x: pitch
    y: pitch
    z: piezo_thick
  rotation:
    x: 0.0
    y: 0.0
    z: 0.0
  alignment: center
- name: Si
  type: box
  position:
    x: 0.0
    y: 0.0
    z: oxide_thk+piezo_thick+top_elec_thk+elastic_thick/2
  size:
    x: pitch
    y: pitch
    z: elastic_thick
  rotation:
    x: 0.0
    y: 0.0
    z: 0.0
  alignment: center
- name: Load
  type: box
  position:
    x: 0.0
    y: 0.0
    z: oxide_thk+piezo_thick+top_elec_thk+elastic_thick+load_thick/2
  size:
    x: pitch
    y: pitch
    z: load_thick
  rotation:
    x: 0.0
    y: 0.0
    z: 0.0
  alignment: center
- name: Cavity
  type: cylinder
  position:
    x: 0.0
    y: 0.0
    z: oxide_thk/2
  axis:
    x: 0.0
    y: 0.0
    z: oxide_thk
  radius: cavity_rad
  rotation:
    x: 0.0
    y: 0.0
    z: 0.0
  alignment: center
- name: Difference
  type: difference
  cadPaths1:
  - - SiO2
  cadPaths2:
  - - Cavity
  deleteTool: true
- name: Bottom electrode
  type: cylinder
  position:
    x: 0.0
    y: 0.0
    z: oxide_thk-bot_elec_thick/2
  axis:
    x: 0.0
    y: 0.0
    z: bot_elec_thick
  radius: bot_elec_rad
  rotation:
    x: 0.0
    y: 0.0
    z: 0.0
  alignment: center
- name: Top electrode
  type: box
  position:
    x: 0.0
    y: 0.0
    z: oxide_thk+piezo_thick+top_elec_thk/2
  size:
    x: pitch
    y: pitch
    z: top_elec_thk
  rotation:
    x: 0.0
    y: 0.0
    z: 0.0
  alignment: center
- name: xcut
  type: box
  position:
    x: -0.5
    y: 0.0
    z: 0.0
  size:
    x: 1.0
    y: 1.0
    z: 1.0
  rotation:
    x: 0.0
    y: 0.0
    z: 0.0
  alignment: center
- name: ycut
  type: box
  position:
    x: 0.0
    y: -0.5
    z: 0.0
  size:
    x: 1.0
    y: 1.0
    z: 1.0
  rotation:
    x: 0.0
    y: 0.0
    z: 0.0
  alignment: center
- name: Difference 2
  type: difference
  cadPaths1:
  - - SiO2
  - - AlN
  - - Si
  - - Load
  - - Bottom electrode
  - - Top electrode
  cadPaths2:
  - - xcut
  - - ycut
  deleteTool: true
