- name: Water
  description: Deionized water, 20 C, 100kPa
  color: '#59AAF3'
  abbreviation: H₂O
  target: Water target
  density: '998'
  heatCapacity: '4182'
  speedOfSound: '1480'
  dynamicViscosity: '8.9e-4'
  electricConductivity: 5e-6
  electricPermittivity: 81*epsilon0
  magneticPermeability: mu0
  thermalConductivity: '0.55'
physicsSets:
- name: Physics 1
  physics:
  - type: elasticWaves
    target: Elastic waves
    interactions:
    - type: elasticWavesPiezoelectricity
      name: Piezoelectricity
      target: AlN target
    - type: elasticWavesClamp
      name: Clamp
      target: Clamp target
    - type: elasticWavesProportionalDamping
      name: Proportional damping
      target: Elastic waves
      elasticWavesProportionalDampingAlpha: qtoalpha(freq, qdamp)
      elasticWavesProportionalDampingBeta: qtobeta(freq, qdamp)
    - type: elasticWavesConstraint
      name: x symm
      target: x symm
      elasticWavesConstraint: '[1, 0; 0, 0; 0, 0]'
    - type: elasticWavesConstraint
      name: y symm
      target: y symm
      elasticWavesConstraint: '[0, 0; 1, 0; 0, 0]'
  - type: electrostatics
    target: AlN target
    interactions:
    - type: electrostaticsConstraint
      name: ground
      target: ground target
      electrostaticsConstraint: '0'
    - type: electrostaticsLump
      name: drive
      namespace: lump
      target: drive target
      electrostaticsLumpVoltage: wavelet(freq, 1.2)
  - type: acousticWaves
    target: Water target
    interactions:
    - type: acousticStructureForElasticWaves
      name: Acoustic structure
    - type: acousticWavesPml
      name: Perfectly matched layer
      target: PML target
      acousticWavesPmlType: acousticWavesPmlTypeBox
meshes:
- name: Mesh extruded
  density: userDefined
  useMeshRefiner: false
  scaleFactor: '1'
  curvatureEnhancement: '6'
  maxRunTimeMinutes: 15
  meshSizeMax: mesh_size
  simpleExtrusion:
    subLayerCounts:
    - '1'
    - '1'
    - '1'
    - '1'
    - '1'
    - '6'
    volumeIds:
    - 1
    - 28
    - 55
    - 82
    - 118
    - 127
simulations:
- name: template
  description: ''
  maxRunTimeMinutes: 60
  solverMode: direct
  analysisType: transient
  mesh: Mesh extruded
  physicsSet: Physics 1
  transientStartTime: '0'
  transientEndTime: ncycles/freq
  transientTimestepSize: 1/freq/ppc
  timestepAlgorithm: genAlpha
  eigenmodePortAnalysis: false
  targetFrequency: freq
  numericalJacobian: false
  disabledScriptSections:
  - solve
  outputs:
  - type: discreteOutput
    name: V
    expression: lump.V
  - type: discreteOutput
    name: Q
    expression: lump.Q
  - type: discreteOutput
    name: Pav
    expression: average(reg.front_face, p, 2)
  - type: discreteOutput
    name: Vav
    expression: average(reg.front_face, dt(compz(u)), 2)
